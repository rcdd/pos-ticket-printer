server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Public demo build: CRA is built with PUBLIC_URL=/demo (see Dockerfile),
    # so the browser requests everything under /demo/* — the reverse proxy
    # forwards the full path here unchanged (no prefix-stripping needed).
    # A local/kiosk build (PUBLIC_URL empty) would instead be served at "/"
    # by pm2 (not this image) — this nginx.conf only serves the demo.

    location = /demo {
        return 301 /demo/;
    }

    location ~* ^/demo/.*\.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|ttf)$ {
        rewrite ^/demo/(.*)$ /$1 break;
        expires 1y;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location /demo/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /demo/index.html;
    }

    location /api/ {
        proxy_pass http://backend_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

upstream backend_service {
    server pos-ticket-printer-api:9393;
}
