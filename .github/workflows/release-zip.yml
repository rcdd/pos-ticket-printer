name: Attach release zip

# Runs on GitHub's own runner (not Ruben's server) whenever a GitHub Release
# is published — builds ui/ and terminal/, zips exactly what a client machine
# needs (matches the manual test-zip exclude list) and uploads it to that
# same release under a FIXED filename, so
# https://github.com/<owner>/<repo>/releases/latest/download/pos-ticket.zip
# always resolves to whatever was last released — no other automation needed.
on:
  release:
    types: [published]
  # Manual fallback: a release published before this workflow existed on the
  # default branch never fires the trigger above and ends up with no asset
  # (this happened to v3.0.4). Backfill it with:
  #   gh workflow run release-zip.yml -f tag=v3.0.4
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and attach the zip to'
        required: true

permissions:
  contents: write

jobs:
  build-and-attach:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Build Terminal
        working-directory: terminal
        run: |
          npm ci
          npm run build

      - name: Zip release package
        run: |
          zip -r -q pos-ticket.zip . \
            -x "*.git/*" ".git*" "*node_modules/*" ".idea/*" ".vs/*" "*.DS_Store" \
            -x "scripts/generate-license.js" ".env" "api/.env" "docs/*" "logs/*" "*.log" \
            -x "pos.pm2.json" ".github/*"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ env.TAG }}" pos-ticket.zip --clobber
