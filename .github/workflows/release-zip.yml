name: Attach release zip

# Runs on GitHub's own runner (not Ruben's server) whenever a GitHub Release
# is published — builds ui/ and terminal/, zips exactly what a client machine
# needs (matches the manual test-zip exclude list) and uploads it to that
# same release under a FIXED filename, so
# https://github.com/<owner>/<repo>/releases/latest/download/pos-ticket.zip
# always resolves to whatever was last released — no other automation needed.
on:
  release:
    types: [published]
  # Manual fallback: a release published before this workflow existed on the
  # default branch never fires the trigger above and ends up with no asset
  # (this happened to v3.0.4). Backfill it with:
  #   gh workflow run release-zip.yml -f tag=v3.0.4
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and attach the zip to'
        required: true

permissions:
  contents: write

jobs:
  build-and-attach:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build UI
        working-directory: ui
        # CRA treats ESLint warnings as build errors when CI=true, which
        # GitHub Actions sets automatically — this repo has a few pre-existing
        # warnings that don't block local/manual builds, only this one.
        env:
          CI: false
        run: |
          npm ci
          npm run build

      - name: Build Terminal
        working-directory: terminal
        run: |
          npm ci
          npm run build

      # Shipped inside the zip so a client machine can update without internet
      # (USB stick). Every API dependency is plain JS except bcrypt, whose npm
      # package already carries a win32-x64 prebuild, so installing on this
      # Linux runner is fine.
      - name: Install API production dependencies
        working-directory: api
        # The check fails the release if any runtime dependency is missing,
        # e.g. one also listed in devDependencies, which --omit=dev drops.
        run: |
          npm ci --omit=dev
          node -e "const fs=require('fs');const deps=Object.keys(require('./package.json').dependencies);const missing=deps.filter(d=>!fs.existsSync('node_modules/'+d+'/package.json'));if(missing.length){console.error('Missing API dependencies:',missing.join(', '));process.exit(1)}"

      - name: Zip release package
        run: |
          zip -r -q pos-ticket.zip . \
            -x "*.git/*" ".git*" "node_modules/*" "ui/node_modules/*" "terminal/node_modules/*" \
            -x ".idea/*" ".vs/*" "*.DS_Store" \
            -x "scripts/generate-license.js" ".env" "api/.env" "docs/*" "logs/*" "*.log" \
            -x "pos.pm2.json" ".github/*"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ env.TAG }}" pos-ticket.zip --clobber
